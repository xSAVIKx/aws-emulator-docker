name: Registry parity

# Check that GHCR, Docker Hub and Quay serve the same signed digest
# for the moving tags. The release workflow does the same check after each publish.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated tags to check
        required: false
        default: latest debian distroless

permissions:
  contents: read

jobs:
  parity:
    name: Registry parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Check digests and signatures on each registry
        shell: bash
        env:
          TAGS: ${{ inputs.tags || 'latest debian distroless' }}
        run: |
          set -euo pipefail
          read -r -a tags <<<"$TAGS"
          ./scripts/check-registry-parity.sh "${tags[@]}" | tee parity.txt
          { echo "### Registry parity"; echo '```'; cat parity.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
