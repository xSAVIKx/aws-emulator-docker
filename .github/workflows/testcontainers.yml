name: Testcontainers modules

on:
  push:
    branches: [main]
    paths: &tc_paths
      - "testcontainers/**"
      - "entrypoint/**"
      - "Dockerfile"
      - ".github/workflows/testcontainers.yml"
  pull_request:
    paths: *tc_paths
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      image:
        description: "Image to test. Empty: build the image from this commit."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.lang }}
    strategy:
      fail-fast: false
      matrix:
        lang: [python, typescript, java, go, dotnet, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The schedule tests the published image. Pushes and pull requests test
      # an image built from the same commit, so a module and a change to the
      # entrypoint can land together.
      AWS_EMULATOR_IMAGE: ${{ inputs.image || (github.event_name == 'schedule' && 'ghcr.io/xsavikx/aws-emulator:latest') || 'aws-emulator:ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.AWS_EMULATOR_IMAGE == 'aws-emulator:ci'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        if: env.AWS_EMULATOR_IMAGE == 'aws-emulator:ci'
        run: docker buildx build --load -t aws-emulator:ci -f Dockerfile --cache-from type=gha,scope=amazonlinux-linux-amd64 .

      - if: matrix.lang == 'python'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - if: matrix.lang == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: testcontainers/typescript/.nvmrc
          cache: npm
          cache-dependency-path: testcontainers/typescript/package-lock.json
      - if: matrix.lang == 'java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: testcontainers/java/pom.xml
      - if: matrix.lang == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: testcontainers/go/go.mod
          cache-dependency-path: testcontainers/go/go.sum
      - if: matrix.lang == 'rust'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: testcontainers/rust
      - if: matrix.lang == 'dotnet'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: testcontainers/dotnet/global.json

      - name: Test
        working-directory: testcontainers/${{ matrix.lang }}
        run: ./run-tests.sh
