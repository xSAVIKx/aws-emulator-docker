version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: gomod
    directory: /healthcheck
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /entrypoint
    schedule:
      interval: weekly

  # The examples. One grouped pull request for each language and week.
  - package-ecosystem: uv
    directory: /examples/python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /examples/typescript
    schedule:
      interval: weekly
    groups:
      typescript:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /examples/java
    schedule:
      interval: weekly
    groups:
      java:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /examples/go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /examples/dotnet
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: dotnet-sdk
    directory: /examples/dotnet
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /examples/rust
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
