name: AWS Emulator
description: >-
  Deprecated path. Use xSAVIKx/run-aws-emulator@v1. Start the AWS Emulator (https://github.com/aws/aws-emulator) in Docker and point the
  AWS CLI and SDKs at it. Unofficial community action.
author: Yurii Serhiichuk
branding:
  icon: cloud
  color: orange

inputs:
  image:
    description: Container image to run
    default: ghcr.io/xsavikx/aws-emulator:latest
  port:
    description: Port on 127.0.0.1. The emulator uses the same port inside the container.
    default: "9297"
  region:
    description: AWS Region for the SDKs
    default: us-east-1
  telemetry:
    description: Upstream emulator telemetry, "on" or "off"
    default: "off"
  memory:
    description: Container memory limit
    default: 2g

outputs:
  endpoint-url:
    description: The emulator endpoint, for example https://127.0.0.1:9297
    value: ${{ steps.start.outputs.endpoint-url }}
  ca-file:
    description: The emulator CA certificate (PEM)
    value: ${{ steps.start.outputs.ca-file }}
  container:
    description: The container name
    value: ${{ steps.start.outputs.container }}

runs:
  using: composite
  steps:
    # The action moved to its own repository: https://github.com/xSAVIKx/run-aws-emulator
    # This path stays as a thin wrapper for workflows that already use it.
    - id: start
      uses: xSAVIKx/run-aws-emulator@7a51c40fa9285e94bf328e4e44ebbde07bddaaac # v1.1.0
      with:
        image: ${{ inputs.image }}
        port: ${{ inputs.port }}
        region: ${{ inputs.region }}
        telemetry: ${{ inputs.telemetry }}
        memory: ${{ inputs.memory }}
