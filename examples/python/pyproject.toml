[project]
name = "aws-emulator-example-python"
version = "0.1.0"
description = "pytest + Boto3 integration tests against the AWS Emulator"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["boto3==1.44.1", "pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Show why each test was skipped or failed, and treat unknown markers as errors.
addopts = "-ra --strict-markers"
testpaths = ["tests"]
